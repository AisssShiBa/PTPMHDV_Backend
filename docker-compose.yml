version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: finvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: finvault-user-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/user_service
      - JWT_SECRET=your_default_jwt_secret_key_must_be_at_least_32_bytes_long
      - INTERNAL_KEY=default_internal_secret_key_123456
    depends_on:
      - postgres

  merchant-service:
    build:
      context: ./services/merchant-service
      dockerfile: Dockerfile
    container_name: finvault-merchant-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/merchant_service
      - JWT_SECRET=your_default_jwt_secret_key_must_be_at_least_32_bytes_long
      - INTERNAL_KEY=default_internal_secret_key_123456
    depends_on:
      - postgres

volumes:
  postgres_data: