services:
  postgres:
    image: postgres:16
    container_name: finvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - internal_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finvault-rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    networks:
      - internal_net
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    secrets:
      - rabbitmq_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  user-migrate:
    build: &user-build
      context: .
      dockerfile: services/user-service/Dockerfile
    image: finvault-user-service:local
    environment: &user-env
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/user_service
      INTERNAL_KEY: ${INTERNAL_KEY:?run scripts/prepare-deployment.mjs}
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      EVENT_EXCHANGE: finvault.events
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:19002}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-finvault-kyc}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run scripts/prepare-deployment.mjs}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run scripts/prepare-deployment.mjs}
      S3_FORCE_PATH_STYLE: 'true'
      KYC_CLEANUP_GRACE_MS: ${KYC_CLEANUP_GRACE_MS:-86400000}
      STORAGE_CLEANUP_ENABLED: ${STORAGE_CLEANUP_ENABLED:-true}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: finvault-user-service
    expose:
      - "3002"
    networks:
      - internal_net
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_service
      - JWT_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  user-consumer:
    image: finvault-user-service:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment: *user-env
    secrets: [gateway_public_key]
    command: ["node", "dist/events/worker.js"]
    depends_on:
      user-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  merchant-migrate:
    build: &merchant-build
      context: .
      dockerfile: services/merchant-service/Dockerfile
    image: finvault-merchant-service:local
    environment: &merchant-env
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/merchant_service
      INTERNAL_KEY: ${INTERNAL_KEY:?run scripts/prepare-deployment.mjs}
      GATEWAY_PUBLIC_KEY_FILE: /run/secrets/gateway_public_key
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      EVENT_EXCHANGE: finvault.events
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  merchant-service:
    build: *merchant-build
    image: finvault-merchant-service:local
    restart: unless-stopped
    init: true
    expose: ["3003"]
    environment: *merchant-env
    secrets: [gateway_public_key]
    depends_on:
      merchant-migrate:
        condition: service_completed_successfully

  broker-init:
    image: finvault-merchant-service:local
    environment: *merchant-env
    command: ["node", "scripts/init-broker.cjs"]
    depends_on:
      merchant-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  merchant-publisher:
    image: finvault-merchant-service:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment: *merchant-env
    secrets: [gateway_public_key]
    command: ["node", "dist/events/worker.js"]
    depends_on:
      merchant-migrate:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully

  minio:
    build:
      context: ./services/merchant-service
      dockerfile: Dockerfile
    container_name: finvault-merchant-service
    expose:
      - "3003"
    networks:
      - internal_net
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/merchant_service
      - JWT_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
    depends_on:
      minio:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: finvault-notification-service
    expose:
      - "3006"
    networks:
      - internal_net
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  wallet-service:
    build:
      context: .
      dockerfile: ./services/wallet-service/Dockerfile
    container_name: finvault-wallet-service
    expose:
      - "3004"
    networks:
      - internal_net
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wallet_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    container_name: finvault-payment-service
    expose:
      - "3005"
    networks:
      - internal_net
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_URL=${VNP_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - VNP_IPN_URL=${VNP_IPN_URL}
    secrets:
      - vnp_hash_secret
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: finvault-auth-service
    expose:
      - "3001"
    networks:
      - internal_net
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_service
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - USER_SERVICE_URL=http://user-service:3002
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - postgres

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    container_name: finvault-admin-service
    secrets: [gateway_public_key]
    expose:
      - "3007"
    networks:
      - internal_net
    environment:
      - PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/admin_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - USER_SERVICE_URL=http://user-service:3002
      - MERCHANT_SERVICE_URL=http://merchant-service:3003
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - postgres

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: finvault-gateway
    secrets: [gateway_private_key, gateway_public_key]
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    networks:
      - public_net
      - internal_net
    secrets:
      - gateway_private_key
    environment:
      - PORT=3000
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - GATEWAY_PRIVATE_KEY_FILE=/run/secrets/gateway_private_key
      - USER_SERVICE_URL=http://user-service:3002
      - MERCHANT_SERVICE_URL=http://merchant-service:3003
      - AUTH_SERVICE_URL=http://auth-service:3001
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - ADMIN_SERVICE_URL=http://admin-service:3007
    depends_on:
      - auth-service
      - admin-service
      - user-service
      - merchant-service
      - notification-service
      - wallet-service
      - payment-service

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass.txt
  gateway_private_key:
    file: ./secrets/gateway_private.pem
  gateway_public_key:
    file: ./secrets/gateway_public.pem
  vnp_hash_secret:
    file: ./secrets/vnp_hash_secret.txt
