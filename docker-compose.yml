services:
  postgres:
    image: postgres:16
    container_name: finvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    expose:
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - internal_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: finvault-rabbitmq
    restart: unless-stopped
    expose:
      - "5672"
      - "15672"
    networks:
      - internal_net
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    secrets:
      - rabbitmq_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: finvault-user-service
    expose:
      - "3002"
    networks:
      - internal_net
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_service
      - JWT_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
    depends_on:
      - postgres

  merchant-service:
    build:
      context: ./services/merchant-service
      dockerfile: Dockerfile
    container_name: finvault-merchant-service
    expose:
      - "3003"
    networks:
      - internal_net
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/merchant_service
      - JWT_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
    depends_on:
      - postgres

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: finvault-notification-service
    expose:
      - "3006"
    networks:
      - internal_net
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  wallet-service:
    build:
      context: ./services/wallet-service
      dockerfile: Dockerfile
    container_name: finvault-wallet-service
    expose:
      - "3004"
    networks:
      - internal_net
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wallet_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: finvault-payment-service
    expose:
      - "3005"
    networks:
      - internal_net
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/payment_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_URL=${VNP_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - VNP_IPN_URL=${VNP_IPN_URL}
    secrets:
      - vnp_hash_secret
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: finvault-auth-service
    expose:
      - "3001"
    networks:
      - internal_net
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_service
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - USER_SERVICE_URL=http://user-service:3002
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - postgres

  admin-service:
    build:
      context: .
      dockerfile: ./services/admin-service/Dockerfile
    container_name: finvault-admin-service
    expose:
      - "3007"
    networks:
      - internal_net
    environment:
      - PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/admin_service
      - INTERNAL_KEY=${INTERNAL_KEY}
      - USER_SERVICE_URL=http://user-service:3002
      - MERCHANT_SERVICE_URL=http://merchant-service:3003
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - postgres

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: finvault-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    networks:
      - public_net
      - internal_net
    secrets:
      - gateway_private_key
    environment:
      - PORT=3000
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - INTERNAL_KEY=${INTERNAL_KEY}
      - CLIENT_URL=${CLIENT_URL}
      - GATEWAY_PRIVATE_KEY_FILE=/run/secrets/gateway_private_key
      - USER_SERVICE_URL=http://user-service:3002
      - MERCHANT_SERVICE_URL=http://merchant-service:3003
      - AUTH_SERVICE_URL=http://auth-service:3001
      - WALLET_SERVICE_URL=http://wallet-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - ADMIN_SERVICE_URL=http://admin-service:3007
    depends_on:
      - auth-service
      - admin-service
      - user-service
      - merchant-service
      - notification-service
      - wallet-service
      - payment-service

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  rabbitmq_pass:
    file: ./secrets/rabbitmq_pass.txt
  gateway_private_key:
    file: ./secrets/gateway_private.pem
  gateway_public_key:
    file: ./secrets/gateway_public.pem
  vnp_hash_secret:
    file: ./secrets/vnp_hash_secret.txt
