name: finvault-user-merchant-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finvault_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finvault_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-alpine
    ports:
      - "127.0.0.1:5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: finvault_test
      MINIO_ROOT_PASSWORD: finvault_test_password
    ports:
      - "127.0.0.1:19000:9000"
